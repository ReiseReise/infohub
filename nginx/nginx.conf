# ============================================================
# 信息中枢 v3 — Nginx 反代配置
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 500m;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # P0-10: 登录端点限流（10 次/分钟，突发 5）
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

    server {
        listen 80;
        server_name _;

        # P0-10: 安全响应头（always 保证错误响应也带上）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Keep the HTML shell and service worker fresh while allowing hashed
        # assets to be cached. Missing asset URLs must return 404 instead of
        # the SPA shell, otherwise stale HTML can surface as a blank app.
        # The former standalone URL now enters the integrated main navigation.
        location ^~ /api/radius-ui/ {
            return 302 /radius;
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files /index.html =404;
        }

        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files /sw.js =404;
        }

        location = /manifest.webmanifest {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache" always;
            try_files /manifest.webmanifest =404;
        }

        location ~* \.(?:js|mjs|css|woff2?|png|svg|ico)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # block audio internal-only routes from unified public entry
        location /api/audio/internal/ {
            return 404;
        }

        location /api/audio/v1/ {
            return 404;
        }

        # audio-service API: /api/audio/* -> /api/*
        location /api/audio/ {
            proxy_pass http://audio-service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 500m;
        }

        # audio-service admin API
        location /api/admin/ai-usage/ {
            proxy_pass http://hub-engine:3001/api/admin/ai-usage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin/retention/ {
            proxy_pass http://hub-engine:3001/api/admin/retention/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin/storage/ {
            proxy_pass http://hub-engine:3001/api/admin/storage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin/ {
            proxy_pass http://audio-service:8000/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # audio-service websocket
        location /ws/ {
            proxy_pass http://audio-service:8000/api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # unified health entry for hub-engine
        location = /api/health {
            proxy_pass http://hub-engine:3001/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # hub-engine API (default)
        # P0-10: 登录端点限流，防口令爆破（须置于通用 /api/ 之前）
        location = /api/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://hub-engine:3001/api/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /api/ {
            proxy_pass http://hub-engine:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /rsshub/ {
            # P0-10: 运维后台需 Basic Auth
            auth_basic "InfoHub Ops";
            auth_basic_user_file /etc/nginx/ops.htpasswd;
            proxy_pass http://rsshub:1200/;
        }

        location /cd/ {
            # P0-10: 运维后台需 Basic Auth
            auth_basic "InfoHub Ops";
            auth_basic_user_file /etc/nginx/ops.htpasswd;
            proxy_pass http://changedetection:5000/;
        }

        location /ntfy/ {
            # P0-10: 运维后台需 Basic Auth
            auth_basic "InfoHub Ops";
            auth_basic_user_file /etc/nginx/ops.htpasswd;
            proxy_pass http://ntfy:80/;
        }

        # Dibao sidecar proxy for diagnostics and manual fallback.
        # The primary user entry is the InfoHub /reader-lab page, because Dibao
        # is a full Vite app and may load root-relative assets when path-prefixed.
        location = /reader-lab/proxy {
            auth_basic "InfoHub Ops";
            auth_basic_user_file /etc/nginx/ops.htpasswd;
            proxy_pass http://dibao-reader:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /reader-lab/proxy/ {
            auth_basic "InfoHub Ops";
            auth_basic_user_file /etc/nginx/ops.htpasswd;
            rewrite ^/reader-lab/proxy/(.*)$ /$1 break;
            proxy_pass http://dibao-reader:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"infohub-nginx"}';
        }
    }
}
