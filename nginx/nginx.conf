# ============================================================
# 信息中枢 v3 — Nginx 反代配置
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 500m;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    server {
        listen 80;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # block audio internal-only routes from unified public entry
        location /api/audio/internal/ {
            return 404;
        }

        location /api/audio/v1/ {
            return 404;
        }

        # audio-service API: /api/audio/* -> /api/*
        location /api/audio/ {
            proxy_pass http://audio-service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 500m;
        }

        # audio-service admin API
        location /api/admin/ai-usage/ {
            proxy_pass http://hub-engine:3001/api/admin/ai-usage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin/retention/ {
            proxy_pass http://hub-engine:3001/api/admin/retention/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin/storage/ {
            proxy_pass http://hub-engine:3001/api/admin/storage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin/ {
            proxy_pass http://audio-service:8000/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # audio-service websocket
        location /ws/ {
            proxy_pass http://audio-service:8000/api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # unified health entry for hub-engine
        location = /api/health {
            proxy_pass http://hub-engine:3001/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # hub-engine API (default)
        location /api/ {
            proxy_pass http://hub-engine:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /rsshub/ {
            proxy_pass http://rsshub:1200/;
        }

        location /cd/ {
            proxy_pass http://changedetection:5000/;
        }

        location /ntfy/ {
            proxy_pass http://ntfy:80/;
        }

        location /health {
            return 200 '{"status":"ok","service":"infohub-nginx"}';
            add_header Content-Type application/json;
        }
    }
}
